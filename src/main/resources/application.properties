spring.application.name=willaistealmyfuture

# Server Configuration
server.port=${PORT:8081}

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Persistence
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jobai;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Logging
logging.level.com.chikere.jobai=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.ai=${SPRING_AI_LOG_LEVEL:INFO}

# Chat model configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5.1}
app.ai.model.premium=${AI_MODEL_PREMIUM:gpt-5.4}
app.ai.model.mini=${AI_MODEL_MINI:gpt-5.4-mini}
app.ai.model.report=${AI_MODEL_REPORT:${app.ai.model.mini}}
spring.ai.openai.connect-timeout=10s
spring.ai.openai.read-timeout=60s

# Retry configuration
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2

# File upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

# AI cost estimation (USD per 1 million tokens — update to match your actual pricing plan)
app.ai.cost.premium.input-per-1m=${AI_COST_PREMIUM_INPUT_PER_1M:2.50}
app.ai.cost.premium.output-per-1m=${AI_COST_PREMIUM_OUTPUT_PER_1M:10.00}
app.ai.cost.mini.input-per-1m=${AI_COST_MINI_INPUT_PER_1M:0.75}
app.ai.cost.mini.output-per-1m=${AI_COST_MINI_OUTPUT_PER_1M:4.50}
app.ai.cost.usd-to-gbp-rate=${AI_COST_USD_TO_GBP_RATE:0.79}

# Stripe Configuration
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.price-id.profession=${STRIPE_PRICE_PROFESSIONAL}
stripe.price-id.course=${STRIPE_PRICE_STUDENT}
stripe.price-id.a-level-undecided=${STRIPE_PRICE_A_LEVEL_UNDECIDED}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# App URL
app.base-url=${APP_BASE_URL}
app.report.price.profession-pence=${APP_REPORT_PRICE_PROFESSION_PENCE:1000}
app.report.price.course-pence=${APP_REPORT_PRICE_COURSE_PENCE:300}
app.report.expiry-hours=${APP_REPORT_EXPIRY_HOURS:24}

# Form limits
app.form.role-summary-word-limit.profession=800
app.form.role-summary-word-limit.course=450
