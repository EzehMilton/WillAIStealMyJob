<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong - Job AI</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                    radial-gradient(circle at 14% 0%, rgba(124, 58, 237, 0.18), transparent 30%),
                    radial-gradient(circle at 92% 0%, rgba(79, 142, 255, 0.16), transparent 28%),
                    linear-gradient(145deg, #0a0e18, #151b2b);
            color: #f8fafc;
        }

        .error-card {
            max-width: 480px;
            padding: 40px 36px;
            border-radius: 22px;
            text-align: center;
            background: rgba(21, 27, 43, 0.9);
            border: 1px solid rgba(147, 197, 253, 0.22);
            box-shadow: 0 18px 54px rgba(5, 8, 18, 0.42), 0 0 34px rgba(96, 165, 250, 0.1);
        }

        .error-status {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(115deg, #93c5fd, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-card p {
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <main class="error-card mx-3">
        <div class="error-status" th:text="${status != null ? status : 'Oops'}">500</div>
        <h1 class="h4 mt-2 mb-3">Something went wrong</h1>
        <p class="mb-4">We hit an unexpected problem while handling your request. Nothing was charged, and if you already paid for a report it is safe — try again in a moment.</p>
        <a href="/" class="btn btn-primary px-4">Back to home</a>
    </main>
</body>
</html>
